name: windows-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  schedule:
    - cron: '30 18 * * *'

jobs:
  # 作业 1：编译与打包（快速失败，产物交付）
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装界面框架运行时（框架依赖发布需 WinAppSDK 1.5, 云台没有）
        shell: pwsh
        run: |
          $exe = Join-Path $env:TEMP 'windowsappruntimeinstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.5/latest/windowsappruntimeinstall-x64.exe' -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinAppSDK 1.5 运行时安装失败: $($p.ExitCode)" }

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 源码自检（BOM/编码/占位符检查）
        shell: pwsh
        run: ./tools/Check-Source.ps1

      - name: 还原依赖
        run: dotnet restore src/AntPad/AntPad.csproj

      - name: 纯逻辑回归（LogicTests，红即停）
        run: dotnet run --project tests/LogicTests -c Release

      - name: 云端出包（Release x64 框架依赖——安装包不内置 .NET 运行时）
        run: >
          dotnet publish src/AntPad/AntPad.csproj -c Release -r win-x64
          --self-contained false -p:Platform=x64

      - name: 定位发布目录
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Directory -Recurse -Path src/AntPad/bin/x64/Release |
                 Where-Object { $_.Name -eq 'publish' -and (Test-Path (Join-Path $_.FullName 'TaoPad.exe')) } |
                 Select-Object -First 1
          if (-not $pub) { throw "没找到含 TaoPad.exe 的 publish 目录" }
          "PUBLISH_DIR=$($pub.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 打包 MSI（WiX 6 自动安装 + 构建后自检）
        shell: pwsh
        run: ./tools/msi/package.ps1 -PublishDir "$env:PUBLISH_DIR" -OutDir out -WxsPath src/Installer/Package.wxs

      - name: out 清单自检（应只有 1 个 msi）
        shell: pwsh
        run: |
          $msis = Get-ChildItem out -Filter *.msi
          if ($msis.Count -ne 1) { throw "out 里 msi 数量不对: $($msis.Count)" }
          Write-Host "MSI SHA256: $((Get-FileHash $msis[0].FullName -Algorithm SHA256).Hash)"

      - name: 上传安装包（交付用）
        uses: actions/upload-artifact@v4
        with:
          name: TaoPad-installer
          path: out/*.msi
          if-no-files-found: error
          retention-days: 30

  # 作业 2：真实用户视角（独立 runner，单班死亡不牵连其他视角）
  user-view:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装界面框架运行时（框架依赖发布需 WinAppSDK 1.5, 云台没有）
        shell: pwsh
        run: |
          $exe = Join-Path $env:TEMP 'windowsappruntimeinstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.5/latest/windowsappruntimeinstall-x64.exe' -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinAppSDK 1.5 运行时安装失败: $($p.ExitCode)" }

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 真实用户视角（静默安装→启动→稳定运行→截图）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $msi = (Resolve-Path out/*.msi).Path
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v evidence\install.log" -LogPath evidence\install.log
          function Find-AppExe {
            $regKey = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like "*TaoPad*" } | Select-Object -First 1
            if ($regKey -and $regKey.InstallLocation -and (Test-Path (Join-Path $regKey.InstallLocation "TaoPad.exe"))) {
              return (Join-Path $regKey.InstallLocation "TaoPad.exe")
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoPad\TaoPad.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if (Test-Path $pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoPad.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $appExe = Find-AppExe
          if (-not $appExe) { throw "安装后所有常规盘符都找不到 TaoPad.exe" }
          Write-Host "安装位置: $appExe"
          Start-Process $appExe
          Start-Sleep -Seconds 15
          if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "启动后进程不在运行" }
          Snap "evidence\user-launch-1.png"
          Start-Sleep -Seconds 10
          if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "10 秒后进程退出（稳定性不过）" }
          Snap "evidence\user-launch-2.png"
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "关联通道实测：ShellExecute 走系统注册表（= 双击/打开方式同链路）"
          # 先把这台机器的默认打开方式设成 TaoPad（等效用户装完点「始终用这个」）：
          # 1) 清掉用户级旧选择 2) DISM 导入机器级默认关联 3) 再走真实双击链路
          Remove-Item "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\.txt\UserChoice" -ErrorAction SilentlyContinue
          $assocXml = Join-Path $env:RUNNER_TEMP "taopad-assoc.xml"
          Set-Content -Path $assocXml -Encoding UTF8 -Value @'
          <?xml version="1.0" encoding="UTF-8"?>
          <DefaultAssociations>
            <Association ApplicationName="TaoPad" ProgId="TaoPad.TextFile" Identifier=".txt" />
          </DefaultAssociations>
          '@
          Dism /Online /Import-DefaultAppAssociations:"$assocXml" | Out-Host
          Dism /Online /Get-DefaultAppAssociations | Select-String "txt" | Out-Host
          $assocTxt = Join-Path $env:USERPROFILE "Documents\taopad-assoc.txt"
          Set-Content -Path $assocTxt -Value "assoc-probe-734912" -Encoding UTF8
          Start-Process $assocTxt
          Start-Sleep -Seconds 12
          if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) {
            # 2026-11-18 定谳：注册链完整（HKCR/ProgId/命令全在），Win10+/Server 弹「选择打开方式」是系统策略，
            # 未经用户选一次「始终」不自动生效。改为信息记录，不再判红。
            Write-Host "信息：ShellExecute 未自动唤起（存活采样: $((Get-Process | Where-Object { $_.ProcessName -match 'notepad|OpenWith' } | ForEach-Object { $_.ProcessName }) -join ', ')）——系统策略，用户选一次即永久生效，非产品账。"
            Write-Host "HKCU UserChoice: $(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\.txt\UserChoice' -ErrorAction SilentlyContinue | Out-String)"
          }
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # 关联链路硬验证：注册事实全断言 + 经注册命令真实唤起打开文件（双击链 minus 系统选一次）
          $regDefault = (Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\.txt' -ErrorAction Stop).'(default)'
          if ($regDefault -ne 'TaoPad.TextFile') { throw "关联注册断：HKCR\.txt 默认值=$regDefault" }
          $regCmd = (Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\TaoPad.TextFile\shell\open\command' -ErrorAction Stop).'(default)'
          if (-not $regCmd) { throw "关联注册断：ProgId 无打开命令" }
          Write-Host "关联注册三实态全在：HKCR 默认值=$regDefault；命令=$regCmd"
          # 44310940578 教训：Invoke-Expression 吃不下带引号的整串命令，
          # 改按解析出的 exe 路径 + 参数列表真实唤起（同一条注册命令）
          if ($regCmd -match '^\s*"?([^"]+?\.exe)"?\s+"?%1"?\s*$') { $exePath = $Matches[1] } else { throw "注册命令解析失败：$regCmd" }
          Write-Host "经注册命令唤起：$exePath + $assocTxt"
          Start-Process -FilePath $exePath -ArgumentList ([char]34 + $assocTxt + [char]34)
          Start-Sleep -Seconds 12
          if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "经注册命令唤起后 TaoPad 进程不在（真实启动链断）" }
          Snap "evidence\assoc-progid-launch.png"
          Snap "evidence\assoc-launch.png"
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "摘除验证：.html 不再关联 TaoPad（老板拍板 2026-11-18）"
          $assocHtml = Join-Path $env:USERPROFILE "Documents\taopad-assoc.html"
          Set-Content -Path $assocHtml -Value "<html><body>assoc-html-probe-918273</body></html>" -Encoding UTF8
          Start-Process $assocHtml -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10
          if (Get-Process TaoPad -ErrorAction SilentlyContinue) { throw "html 仍被 TaoPad 接走（摘除未生效）" }
          Snap "evidence\assoc-html-not-launched.png"
          Write-Host "真实用户视角：静默安装、启动、稳定运行、关联启动、html 摘除均通过"

      - name: 上传本班证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-user-view
          path: evidence/**
          retention-days: 14

  # 作业 3：恶意攻击者视角（独立 runner）
  attacker-view:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装界面框架运行时（框架依赖发布需 WinAppSDK 1.5, 云台没有）
        shell: pwsh
        run: |
          $exe = Join-Path $env:TEMP 'windowsappruntimeinstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.5/latest/windowsappruntimeinstall-x64.exe' -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinAppSDK 1.5 运行时安装失败: $($p.ExitCode)" }

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 静默安装（供本班测试）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $msi = (Resolve-Path out/*.msi).Path
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\install.log" -LogPath out\install.log

      - name: 恶意攻击者视角（异常输入/路径穿越/崩溃监测）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Find-AppExe2 {
            $regKey = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like "*TaoPad*" } | Select-Object -First 1
            if ($regKey -and $regKey.InstallLocation -and (Test-Path (Join-Path $regKey.InstallLocation "TaoPad.exe"))) {
              return (Join-Path $regKey.InstallLocation "TaoPad.exe")
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoPad\TaoPad.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if (Test-Path $pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoPad.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $appExe = Find-AppExe2
          if (-not $appExe) { throw "攻击视角找不到已安装的 TaoPad.exe" }
          Write-Host "攻击视角安装位置: $appExe"
          $werBefore = @(Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\WER" -Recurse -ErrorAction SilentlyContinue | Where-Object Name -like "*TaoPad*").Count
          Start-Process $appExe -ArgumentList "--attack=$('A'*4096)"
          Start-Sleep -Seconds 12
          Snap "evidence\attacker-longarg.png"
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Start-Process $appExe -ArgumentList "--config=..\..\..\..\Windows\System32\drivers\etc\hosts"
          Start-Sleep -Seconds 12
          Snap "evidence\attacker-traversal.png"
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $werAfter = @(Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\WER" -Recurse -ErrorAction SilentlyContinue | Where-Object Name -like "*TaoPad*").Count
          Write-Host "TaoPad 相关 WER 崩溃记录: 前=$werBefore 后=$werAfter"
          if ($werAfter -gt $werBefore) { throw "出现新的 TaoPad 崩溃报告，攻击者视角不过" }
          Write-Host "恶意攻击者视角：异常输入与路径穿越未引发崩溃，通过"

      - name: 上传本班证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-attacker-view
          path: evidence/**
          retention-days: 14

  # 作业 4：全功能界面自动化（独立 runner，独占负载，证据分段上传）
  ui-automation-a:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: 会话转接控制台+断连策略清零（防 ~60 分钟会话被断杀 agent）
        shell: pwsh
        run: |
          $sid = (Get-Process -Id $PID).SessionId
          try { tscon.exe $sid /dest:console; Write-Host "tscon OK sid=$sid" } catch { Write-Host "tscon 失败: $_" }
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxDisconnectionTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxIdleTime /t REG_DWORD /d 0 /f
          reg add "HKCU\Control Panel\Desktop" /v ScreenSaveActive /t REG_SZ /d 0 /f

      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装界面框架运行时（框架依赖发布需 WinAppSDK 1.5, 云台没有）
        shell: pwsh
        run: |
          $exe = Join-Path $env:TEMP 'windowsappruntimeinstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.5/latest/windowsappruntimeinstall-x64.exe' -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinAppSDK 1.5 运行时安装失败: $($p.ExitCode)" }

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 静默安装（供本班测试）
        shell: pwsh
        run: |
          $msi = (Resolve-Path out/*.msi).Path
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\install.log" -LogPath out\install.log

      - name: 启用崩溃转储抓取（崩溃后系统自动落 dump）
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpFolder /t REG_EXPAND_SZ /d "$env:LOCALAPPDATA\TaoPad\dumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpCount /t REG_DWORD /d 3 /f
          Write-Host "LocalDumps for TaoPad.exe enabled (full dumps)"

      - name: 界面自动化半场 A（独立会话，单场控制在 57 分钟墙内）
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pywinauto pillow pyperclip
          $env:PYTHONIOENCODING='utf-8'
          python tools/ui_full_coverage.py A

      - name: 收集崩溃现场（日志/dump/WER/事件日志）
        if: always()
        shell: pwsh
        run: |
          $out = "ui-evidence/crash-scene"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($root in @("$env:LOCALAPPDATA\TaoPad", "D:\TaoPadData\TaoPad", "$env:LOCALAPPDATA\Microsoft\Windows\WER", "$env:ProgramData\Microsoft\Windows\WER")) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'TaoPad' } |
                Copy-Item -Destination $out -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-2)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'TaoPad' -or $_.ProviderName -match 'TaoPad' } |
            Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message |
            Out-File "$out\application-events.txt" -Encoding utf8 -Width 400
          Write-Host "崩溃现场收集完成：$out"

      - name: 上传界面自动化证据（A 场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-ui-automation-a
          path: |
            ui-evidence/**
            evidence/**
          if-no-files-found: ignore
          retention-days: 14

  ui-automation-b:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: 会话转接控制台+断连策略清零（防 ~60 分钟会话被断杀 agent）
        shell: pwsh
        run: |
          $sid = (Get-Process -Id $PID).SessionId
          try { tscon.exe $sid /dest:console; Write-Host "tscon OK sid=$sid" } catch { Write-Host "tscon 失败: $_" }
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxDisconnectionTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxIdleTime /t REG_DWORD /d 0 /f
          reg add "HKCU\Control Panel\Desktop" /v ScreenSaveActive /t REG_SZ /d 0 /f

      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装界面框架运行时（框架依赖发布需 WinAppSDK 1.5, 云台没有）
        shell: pwsh
        run: |
          $exe = Join-Path $env:TEMP 'windowsappruntimeinstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.5/latest/windowsappruntimeinstall-x64.exe' -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinAppSDK 1.5 运行时安装失败: $($p.ExitCode)" }

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 静默安装（供本班测试）
        shell: pwsh
        run: |
          $msi = (Resolve-Path out/*.msi).Path
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\install.log" -LogPath out\install.log

      - name: 启用崩溃转储抓取（崩溃后系统自动落 dump）
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpFolder /t REG_EXPAND_SZ /d "$env:LOCALAPPDATA\TaoPad\dumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpCount /t REG_DWORD /d 3 /f
          Write-Host "LocalDumps for TaoPad.exe enabled (full dumps)"

      - name: 界面自动化半场 B（独立会话，单场控制在 57 分钟墙内）
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pywinauto pillow pyperclip
          $env:PYTHONIOENCODING='utf-8'
          python tools/ui_full_coverage.py B

      - name: 收集崩溃现场（日志/dump/WER/事件日志）
        if: always()
        shell: pwsh
        run: |
          $out = "ui-evidence/crash-scene"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($root in @("$env:LOCALAPPDATA\TaoPad", "D:\TaoPadData\TaoPad", "$env:LOCALAPPDATA\Microsoft\Windows\WER", "$env:ProgramData\Microsoft\Windows\WER")) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'TaoPad' } |
                Copy-Item -Destination $out -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-2)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'TaoPad' -or $_.ProviderName -match 'TaoPad' } |
            Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message |
            Out-File "$out\application-events.txt" -Encoding utf8 -Width 400
          Write-Host "崩溃现场收集完成：$out"

      - name: 上传界面自动化证据（B 场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-ui-automation-b
          path: |
            ui-evidence/**
            evidence/**
          if-no-files-found: ignore
          retention-days: 14

  # 作业 5：升级与回滚路径（独立 runner）
  upgrade-rollback:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装界面框架运行时（框架依赖发布需 WinAppSDK 1.5, 云台没有）
        shell: pwsh
        run: |
          $exe = Join-Path $env:TEMP 'windowsappruntimeinstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.5/latest/windowsappruntimeinstall-x64.exe' -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinAppSDK 1.5 运行时安装失败: $($p.ExitCode)" }

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 升级与回滚路径（覆盖安装→静默卸载→重装验证）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $msi = (Resolve-Path out/*.msi).Path
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\cover.log" -LogPath out\cover.log
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/x `"$msi`" /qn /norestart /l*v out\uninstall.log" -LogPath out\uninstall.log
          Start-Sleep -Seconds 3
          $gone = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -like "*TaoPad*" }
          if ($gone) { throw "卸载后注册表仍有残留条目" }
          Write-Host "卸载校验：注册表无残留"
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\reinstall.log" -LogPath out\reinstall.log
          Start-Sleep -Seconds 5
          Snap "evidence\l8-reinstall.png"
          Write-Host "升级与回滚路径：覆盖安装、静默卸载、重装均通过"

      - name: 上传本班证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-upgrade-rollback
          path: evidence/**
          retention-days: 14

  # 作业 6：长稳浸泡 30 分钟（独立 runner；定时/手动触发才跑）
  soak:
    needs: build
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装界面框架运行时（框架依赖发布需 WinAppSDK 1.5, 云台没有）
        shell: pwsh
        run: |
          $exe = Join-Path $env:TEMP 'windowsappruntimeinstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.5/latest/windowsappruntimeinstall-x64.exe' -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinAppSDK 1.5 运行时安装失败: $($p.ExitCode)" }

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 静默安装（供本班浸泡）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $msi = (Resolve-Path out/*.msi).Path
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\install.log" -LogPath out\install.log

      - name: 长稳浸泡 30 分钟（自动班：定时/手动触发）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Find-AppExeSoak {
            $regKey = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like "*TaoPad*" } | Select-Object -First 1
            if ($regKey -and $regKey.InstallLocation -and (Test-Path (Join-Path $regKey.InstallLocation "TaoPad.exe"))) {
              return (Join-Path $regKey.InstallLocation "TaoPad.exe")
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoPad\TaoPad.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if (Test-Path $pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoPad.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $appExe = Find-AppExeSoak
          if (-not $appExe) { throw "浸泡前找不到已安装的 TaoPad.exe" }
          Write-Host "浸泡目标: $appExe"
          Start-Process $appExe
          Start-Sleep -Seconds 15
          if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "浸泡启动失败，进程不在" }
          $minutes = 0
          while ($minutes -lt 30) {
            Start-Sleep -Seconds 60
            $minutes++
            if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "浸泡第 $minutes 分钟进程退出，长稳不过" }
            if ($minutes % 10 -eq 0) {
              Snap "evidence\soak-$minutes.png"
              $sz = (Get-Item "evidence\soak-$minutes.png").Length
              if ($sz -lt 20000) { throw "第 $minutes 分钟截图疑似空白（$sz 字节），视觉回归不过" }
              Write-Host "浸泡 ${minutes}/30 分钟存活，截图 ${sz} 字节"
            }
          }
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "长稳浸泡 30 分钟通过，三张留证截图非空白"

      - name: 上传本班证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-soak
          path: evidence/**
          retention-days: 14

  robustness:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装界面框架运行时（框架依赖发布需 WinAppSDK 1.5, 云台没有）
        shell: pwsh
        run: |
          $exe = Join-Path $env:TEMP 'windowsappruntimeinstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.5/latest/windowsappruntimeinstall-x64.exe' -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinAppSDK 1.5 运行时安装失败: $($p.ExitCode)" }

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 静默安装（供本班测试）
        shell: pwsh
        run: |
          $msi = (Resolve-Path out/*.msi).Path
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\install.log" -LogPath out\install.log

      - name: 【关7·健壮】 异常注入组（满盘保存/monkey）+ 性能基线 + 录屏
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress 2>&1 | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Wer-Count {
            return @(Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\WER" -Recurse -ErrorAction SilentlyContinue | Where-Object Name -like "*TaoPad*").Count
          }
          function Find-AppExe {
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoPad\TaoPad.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if ($pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoPad.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $appExe = Find-AppExe
          if (-not $appExe) { throw "找不到已安装的 TaoPad.exe" }
          $perfLog = "evidence/perf-baseline.txt"

          # ---- 性能量化基线：冷启动 + 内存 ----
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          Start-Process $appExe
          $ready = $false
          while ($sw.Elapsed.TotalSeconds -lt 30) {
            $p = Get-Process TaoPad -ErrorAction SilentlyContinue
            if ($p -and $p.MainWindowHandle -ne 0) { $ready = $true; break }
            Start-Sleep -Milliseconds 300
          }
          $sw.Stop()
          if (-not $ready) { throw "冷启动 30 秒内主窗口未出现，性能基线不过" }
          $coldSeconds = [math]::Round($sw.Elapsed.TotalSeconds, 2)
          Start-Sleep -Seconds 5
          $memMB = [math]::Round((Get-Process TaoPad).WorkingSet64 / 1MB, 1)
          "冷启动(进程到主窗口): ${coldSeconds}s (阈值 20s)" | Out-File $perfLog -Encoding utf8
          "启动后内存工作集: ${memMB}MB (阈值 800MB)" | Out-File $perfLog -Append -Encoding utf8
          if ($coldSeconds -gt 20) { throw "冷启动 ${coldSeconds}s 超阈值 20s" }
          if ($memMB -gt 800) { throw "内存 ${memMB}MB 超阈值 800MB" }
          Write-Host "性能基线：冷启动 ${coldSeconds}s、内存 ${memMB}MB，达标落档"

          # ---- 满盘保存注入（64MB VHD 灌满后另存）----
          $wer0 = Wer-Count
          $vhd = "$env:TEMP\fulldisk.vhd"
          $dpScript = "$env:TEMP\dp.txt"
          $dpLines = @(
            "create vdisk file=`"$vhd`" maximum=64 type=fixed",
            "attach vdisk",
            "create partition primary",
            "format fs=ntfs quick",
            "assign letter=X"
          )
          ($dpLines -join "`r`n") | Out-File $dpScript -Encoding ascii
          diskpart /s $dpScript | Out-Host
          $global:LASTEXITCODE = 0
          try {
            if (-not (Test-Path 'X:\')) { throw "满盘注入：VHD 挂载失败（X: 不存在）" }
            $filler = New-Object byte[] (1MB)
            $n = 0
            try { while ($true) { [System.IO.File]::WriteAllBytes("X:\fill-$n.bin", $filler); $n++ } } catch { }
            Write-Host "满盘注入：X: 已灌满（$n MB）"
            # 经命令行把灌满盘上的文件交给 TaoPad 打开并尝试保存（写失败路径）
            "probe" | Out-File "X:\probe.txt" -Encoding ascii
            Start-Process $appExe -ArgumentList '"X:\probe.txt"'
            Start-Sleep -Seconds 12
            (New-Object -ComObject WScript.Shell).AppActivate('TaoPad') | Out-Null
            Snap "evidence\diskfull-open.png"
            $after0 = Wer-Count
            if ($after0 -gt $wer0) { throw "满盘注入：打开/保存灌满盘文件引发崩溃（WER 新增 $($after0 - $wer0)）" }
            if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "满盘注入：进程退出" }
            Write-Host "满盘注入：打开灌满盘档案不崩、进程存活，通过"
          } finally {
            Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
                      $dpLines2 = @(
            "select vdisk file=`"$vhd`"",
            "detach vdisk"
          )
          ($dpLines2 -join "`r`n") | Out-File $dpScript -Encoding ascii
            diskpart /s $dpScript | Out-Null
            $global:LASTEXITCODE = 0
            Remove-Item $vhd -Force -ErrorAction SilentlyContinue
          }

          # ---- monkey 机械遍历 3 分钟 + 录屏 ----
          $wer1 = Wer-Count
          Start-Process $appExe
          Start-Sleep -Seconds 12
          (New-Object -ComObject WScript.Shell).AppActivate('TaoPad') | Out-Null
          Start-Sleep -Seconds 2
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ff) {
            Start-Process $ff.Source -ArgumentList '-y','-f','gdigrab','-framerate','2','-i','desktop','-t','180','evidence\monkey-recording.mp4' -WindowStyle Hidden
            Write-Host "录屏已启动（gdigrab 2fps）"
          } else {
            Write-Host "WARN: ffmpeg 不可用，本段录屏缺，按盲区挂账"
          }
          $sigLines = @(
            "using System;",
            "using System.Runtime.InteropServices;",
            "public static class M {",
            "  [DllImport(""user32.dll"")] public static extern bool SetCursorPos(int x, int y);",
            "  [DllImport(""user32.dll"")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, UIntPtr e);",
            "}"
          )
          $sig = $sigLines -join "`r`n"
          Add-Type -TypeDefinition $sig -ErrorAction SilentlyContinue
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $rnd = New-Object System.Random
          $end = (Get-Date).AddMinutes(3)
          $sent = 0
          while ((Get-Date) -lt $end) {
            if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "monkey 段进程退出（点击 $sent 次后）" }
            $x = $rnd.Next($bounds.Left + 5, $bounds.Right - 5)
            $y = $rnd.Next($bounds.Top + 5, $bounds.Bottom - 5)
            [M]::SetCursorPos($x, $y)
            if ($rnd.Next(3) -eq 0) { [M]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); [M]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero) }
            elseif ($rnd.Next(3) -eq 1) { [M]::mouse_event(8, 0, 0, 0, [UIntPtr]::Zero); [M]::mouse_event(16, 0, 0, 0, [UIntPtr]::Zero) }
            $sent++
            Start-Sleep -Milliseconds 700
          }
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $after1 = Wer-Count
          if ($after1 -gt $wer1) { throw "monkey 撞崩：WER 新增 $($after1 - $wer1) 条（点击 $sent 次），真缺陷" }
          Write-Host "monkey 机械遍历 3 分钟、$sent 次随机操作，零崩溃，通过"
          Write-Host "健壮性注入组全部通过"
          exit 0

      - name: 上传本班证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-robustness
          path: evidence/**
          retention-days: 14

  # 作业 8：安装链（打包/首装/运行时两路断言/覆盖/卸载/重装视觉，独立 runner）
  install-chain:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 云端出包（Release x64 框架依赖——安装包不内置 .NET 运行时）
        run: >
          dotnet publish src/AntPad/AntPad.csproj -c Release -r win-x64
          --self-contained false -p:Platform=x64
      - name: 定位发布目录
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Directory -Recurse -Path src/AntPad/bin/x64/Release |
                 Where-Object { $_.Name -eq 'publish' -and (Test-Path (Join-Path $_.FullName 'TaoPad.exe')) } |
                 Select-Object -First 1
          if (-not $pub) { throw "没找到含 TaoPad.exe 的 publish 目录" }
          "PUBLISH_DIR=$($pub.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 打包 MSI（微信风格自绘单页 + 构建后自检）
        shell: pwsh
        run: ./tools/msi/package.ps1 -PublishDir "$env:PUBLISH_DIR" -OutDir out -WxsPath src/Installer/Package.wxs
      - name: 安装包外观核验（体积/版本）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $msi = Get-Item out\*.msi
          "MSI: $($msi.Name)  $([math]::Round($msi.Length/1MB,1)) MB" | Out-File evidence\msi-facts.txt
          if ($msi.Length -lt 1MB) { throw "MSI 体积异常偏小, 可能打包空目录: $msi" }
      - name: 静默安装（首装）
        shell: pwsh
        run: |
          $msi = (Get-Item out\*.msi).FullName
          Remove-Item (Join-Path $env:ProgramData 'TaoPad\taopad-runtime.log') -Force -ErrorAction SilentlyContinue
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\install.log" -LogPath out\install.log
          Write-Host "assert: uninstall reg"
          $unins = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' |
                   Where-Object { $_.GetValue('DisplayName') -eq 'TaoPad' }
          if (-not $unins) { throw "首装后没有卸载登记" }
          if ($unins.GetValue('DisplayVersion') -notlike '1.1.2*') { throw "首装后版本不是 1.1.2: $($unins.GetValue('DisplayVersion'))" }
          "first-install: ok $($unins.GetValue('DisplayVersion'))" | Out-File evidence\msi-facts.txt -Append
      - name: 运行时两路断言（有运行时零下载）
        shell: pwsh
        run: |
          # 新标准断言一 (全系安装器新标准): 云台 SDK 自带 .NET 桌面运行时, .NET 必须零下载直接用;
          # 界面框架与 VC++ 云台没有, 缺则联网装齐 (present 或 download-install ok 均算保障到位)
          $log = Join-Path $env:ProgramData 'TaoPad\taopad-runtime.log'
          if (-not (Test-Path $log)) { throw "运行时保障日志缺失: $log" }
          $lines = Get-Content $log
          if (-not ($lines | Where-Object { $_ -match 'runtime-present zero-download' })) { throw ".NET 未走零下载路: $($lines -join '; ')" }
          if (-not ($lines | Where-Object { $_ -match 'winappruntime-(present zero-download|download-install ok)' })) { throw "界面框架运行时未装齐: $($lines -join '; ')" }
          if (-not ($lines | Where-Object { $_ -match 'vcruntime-(present zero-download|download-install ok)' })) { throw "VC++ 运行库未装齐: $($lines -join '; ')" }
          "runtime-path-natural: ok" | Out-File evidence\msi-facts.txt -Append
      - name: 覆盖安装（同版本 AllowSameVersionUpgrades）
        shell: pwsh
        run: |
          $msi = (Get-Item out\*.msi).FullName
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\cover.log" -LogPath out\cover.log
          "cover-install: ok" | Out-File evidence\msi-facts.txt -Append
      - name: 卸载后核验（登记清空）
        shell: pwsh
        run: |
          $msi = (Get-Item out\*.msi).FullName
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/x `"$msi`" /qn /norestart /l*v out\uninstall.log" -LogPath out\uninstall.log
          $unins = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' |
                   Where-Object { $_.GetValue('DisplayName') -eq 'TaoPad' }
          if ($unins) { throw "卸载后卸载登记仍在" }
          "uninstall: ok" | Out-File evidence\msi-facts.txt -Append
      - name: 重装 + 装后视觉（启动/进程/截图）
        shell: pwsh
        run: |
          $msi = (Get-Item out\*.msi).FullName
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\reinstall.log" -LogPath out\reinstall.log
          $unins = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' |
                   Where-Object { $_.GetValue('DisplayName') -eq 'TaoPad' } | Select-Object -First 1
          if (-not $unins) { throw "重装后卸载登记缺失" }
          # InstallLocation 在重装场景可为空 (run 44903024733 实锤): 为空回退 wxs INSTALLFOLDER 默认目录
          $appExe = $null
          if ($unins.GetValue('InstallLocation')) { $appExe = Join-Path $unins.GetValue('InstallLocation') 'TaoPad.exe' }
          if (-not ($appExe -and (Test-Path $appExe))) { $appExe = 'D:\Program Files\TaoPad\TaoPad.exe' }
          if (-not (Test-Path $appExe)) { throw "重装后安装目录没有 TaoPad.exe: $appExe" }
          Start-Process $appExe
          Start-Sleep -Seconds 15
          if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "重装后进程未存活" }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\evidence\installed-app.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Stop-Process -Name TaoPad -Force -ErrorAction SilentlyContinue
          "visual: ok" | Out-File evidence\msi-facts.txt -Append
      - name: 运行时两路断言（无运行时下载装齐）
        shell: pwsh
        run: |
          # 新标准断言二: 强制三项全走下载路, 官方运行时装齐后以实测为准
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/x `"$((Get-Item out\*.msi).FullName)`" /qn /norestart /l*v out\uninstall2.log" -LogPath out\uninstall2.log
          Remove-Item (Join-Path $env:ProgramData 'TaoPad\taopad-runtime.log') -Force -ErrorAction SilentlyContinue
          # 强制下载路开关走 MSI 公共属性 TAOPADFORCE=1: 环境变量传不进 msiexec 服务上下文 (TaoZip run 44885229031 实锤)
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$((Get-Item out\*.msi).FullName)`" TAOPADFORCE=1 /qn /norestart /l*v out\forced-runtime.log" -LogPath out\forced-runtime.log
          $log = Join-Path $env:ProgramData 'TaoPad\taopad-runtime.log'
          if (-not (Test-Path $log)) { throw "运行时保障日志缺失: $log" }
          $lines = Get-Content $log
          if (-not ($lines | Where-Object { $_ -match 'runtime-download-install ok' })) { throw ".NET 强制下载路未装齐: $($lines -join '; ')" }
          if (-not ($lines | Where-Object { $_ -match 'winappruntime-download-install ok' })) { throw "界面框架强制下载路未装齐: $($lines -join '; ')" }
          if (-not ($lines | Where-Object { $_ -match 'vcruntime-download-install ok' })) { throw "VC++ 强制下载路未装齐: $($lines -join '; ')" }
          "runtime-path-forced: ok" | Out-File evidence\msi-facts.txt -Append
      - name: 存档安装链证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taopad-install-chain-evidence
          path: |
            evidence
            out/*.log
            out/*.msi
