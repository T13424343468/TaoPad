name: windows-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  schedule:
    - cron: '30 18 * * *'

jobs:
  # 作业 1：编译与打包（快速失败，产物交付）
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 源码自检（BOM/编码/占位符检查）
        shell: pwsh
        run: ./tools/Check-Source.ps1

      - name: 还原依赖
        run: dotnet restore src/AntPad/AntPad.csproj

      - name: 云端 Windows 编译（Release x64 自包含）
        run: >
          dotnet publish src/AntPad/AntPad.csproj -c Release -r win-x64
          --self-contained true -p:WindowsAppSDKSelfContained=true -p:Platform=x64

      - name: 定位发布目录
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Directory -Recurse -Path src/AntPad/bin/x64/Release |
                 Where-Object { $_.Name -eq 'publish' -and (Test-Path (Join-Path $_.FullName 'TaoPad.exe')) } |
                 Select-Object -First 1
          if (-not $pub) { throw "没找到含 TaoPad.exe 的 publish 目录" }
          "PUBLISH_DIR=$($pub.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 打包 MSI（WiX 6 自动安装 + 构建后自检）
        shell: pwsh
        run: ./tools/msi/package.ps1 -PublishDir "$env:PUBLISH_DIR" -OutDir out -WxsPath src/Installer/Package.wxs

      - name: out 清单自检（应只有 1 个 msi）
        shell: pwsh
        run: |
          $msis = Get-ChildItem out -Filter *.msi
          if ($msis.Count -ne 1) { throw "out 里 msi 数量不对: $($msis.Count)" }
          Write-Host "MSI SHA256: $((Get-FileHash $msis[0].FullName -Algorithm SHA256).Hash)"

      - name: 上传安装包（交付用）
        uses: actions/upload-artifact@v4
        with:
          name: TaoPad-installer
          path: out/*.msi
          if-no-files-found: error
          retention-days: 30

  # 作业 2：真实用户视角（独立 runner，单班死亡不牵连其他视角）
  user-view:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 真实用户视角（静默安装→启动→稳定运行→截图）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $msi = (Resolve-Path out/*.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart","/l*v","evidence\install.log" -Wait -PassThru
          Write-Host "msiexec 退出码: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "静默安装失败，退出码 $($p.ExitCode)" }
          function Find-AppExe {
            $regKey = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like "*TaoPad*" } | Select-Object -First 1
            if ($regKey -and $regKey.InstallLocation -and (Test-Path (Join-Path $regKey.InstallLocation "TaoPad.exe"))) {
              return (Join-Path $regKey.InstallLocation "TaoPad.exe")
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoPad\TaoPad.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if (Test-Path $pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoPad.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $appExe = Find-AppExe
          if (-not $appExe) { throw "安装后所有常规盘符都找不到 TaoPad.exe" }
          Write-Host "安装位置: $appExe"
          Start-Process $appExe
          Start-Sleep -Seconds 15
          if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "启动后进程不在运行" }
          Snap "evidence\user-launch-1.png"
          Start-Sleep -Seconds 10
          if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "10 秒后进程退出（稳定性不过）" }
          Snap "evidence\user-launch-2.png"
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "真实用户视角：静默安装、启动、稳定运行均通过"

      - name: 上传本班证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-user-view
          path: evidence/**
          retention-days: 14

  # 作业 3：恶意攻击者视角（独立 runner）
  attacker-view:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 静默安装（供本班测试）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $msi = (Resolve-Path out/*.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装失败，退出码 $($p.ExitCode)" }

      - name: 恶意攻击者视角（异常输入/路径穿越/崩溃监测）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Find-AppExe2 {
            $regKey = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like "*TaoPad*" } | Select-Object -First 1
            if ($regKey -and $regKey.InstallLocation -and (Test-Path (Join-Path $regKey.InstallLocation "TaoPad.exe"))) {
              return (Join-Path $regKey.InstallLocation "TaoPad.exe")
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoPad\TaoPad.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if (Test-Path $pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoPad.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $appExe = Find-AppExe2
          if (-not $appExe) { throw "攻击视角找不到已安装的 TaoPad.exe" }
          Write-Host "攻击视角安装位置: $appExe"
          $werBefore = @(Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\WER" -Recurse -ErrorAction SilentlyContinue | Where-Object Name -like "*TaoPad*").Count
          Start-Process $appExe -ArgumentList "--attack=$('A'*4096)"
          Start-Sleep -Seconds 12
          Snap "evidence\attacker-longarg.png"
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Start-Process $appExe -ArgumentList "--config=..\..\..\..\Windows\System32\drivers\etc\hosts"
          Start-Sleep -Seconds 12
          Snap "evidence\attacker-traversal.png"
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $werAfter = @(Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\WER" -Recurse -ErrorAction SilentlyContinue | Where-Object Name -like "*TaoPad*").Count
          Write-Host "TaoPad 相关 WER 崩溃记录: 前=$werBefore 后=$werAfter"
          if ($werAfter -gt $werBefore) { throw "出现新的 TaoPad 崩溃报告，攻击者视角不过" }
          Write-Host "恶意攻击者视角：异常输入与路径穿越未引发崩溃，通过"

      - name: 上传本班证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-attacker-view
          path: evidence/**
          retention-days: 14

  # 作业 4：全功能界面自动化（独立 runner，独占负载，证据分段上传）
  ui-automation-a:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: 会话转接控制台+断连策略清零（防 ~60 分钟会话被断杀 agent）
        shell: pwsh
        run: |
          $sid = (Get-Process -Id $PID).SessionId
          try { tscon.exe $sid /dest:console; Write-Host "tscon OK sid=$sid" } catch { Write-Host "tscon 失败: $_" }
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxDisconnectionTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxIdleTime /t REG_DWORD /d 0 /f
          reg add "HKCU\Control Panel\Desktop" /v ScreenSaveActive /t REG_SZ /d 0 /f

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 静默安装（供本班测试）
        shell: pwsh
        run: |
          $msi = (Resolve-Path out/*.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装失败，退出码 $($p.ExitCode)" }

      - name: 启用崩溃转储抓取（崩溃后系统自动落 dump）
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpFolder /t REG_EXPAND_SZ /d "$env:LOCALAPPDATA\TaoPad\dumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpCount /t REG_DWORD /d 3 /f
          Write-Host "LocalDumps for TaoPad.exe enabled (full dumps)"

      - name: 界面自动化半场 A（独立会话，单场控制在 57 分钟墙内）
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pywinauto pillow pyperclip
          $env:PYTHONIOENCODING='utf-8'
          python tools/ui_full_coverage.py A

      - name: 收集崩溃现场（日志/dump/WER/事件日志）
        if: always()
        shell: pwsh
        run: |
          $out = "ui-evidence/crash-scene"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($root in @("$env:LOCALAPPDATA\TaoPad", "D:\TaoPadData\TaoPad", "$env:LOCALAPPDATA\Microsoft\Windows\WER", "$env:ProgramData\Microsoft\Windows\WER")) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'TaoPad' } |
                Copy-Item -Destination $out -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-2)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'TaoPad' -or $_.ProviderName -match 'TaoPad' } |
            Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message |
            Out-File "$out\application-events.txt" -Encoding utf8 -Width 400
          Write-Host "崩溃现场收集完成：$out"

      - name: 上传界面自动化证据（A 场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-ui-automation-a
          path: |
            ui-evidence/**
            evidence/**
          if-no-files-found: ignore
          retention-days: 14

  ui-automation-b:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: 会话转接控制台+断连策略清零（防 ~60 分钟会话被断杀 agent）
        shell: pwsh
        run: |
          $sid = (Get-Process -Id $PID).SessionId
          try { tscon.exe $sid /dest:console; Write-Host "tscon OK sid=$sid" } catch { Write-Host "tscon 失败: $_" }
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxDisconnectionTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxIdleTime /t REG_DWORD /d 0 /f
          reg add "HKCU\Control Panel\Desktop" /v ScreenSaveActive /t REG_SZ /d 0 /f

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 静默安装（供本班测试）
        shell: pwsh
        run: |
          $msi = (Resolve-Path out/*.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装失败，退出码 $($p.ExitCode)" }

      - name: 启用崩溃转储抓取（崩溃后系统自动落 dump）
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpFolder /t REG_EXPAND_SZ /d "$env:LOCALAPPDATA\TaoPad\dumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TaoPad.exe" /v DumpCount /t REG_DWORD /d 3 /f
          Write-Host "LocalDumps for TaoPad.exe enabled (full dumps)"

      - name: 界面自动化半场 B（独立会话，单场控制在 57 分钟墙内）
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pywinauto pillow pyperclip
          $env:PYTHONIOENCODING='utf-8'
          python tools/ui_full_coverage.py B

      - name: 收集崩溃现场（日志/dump/WER/事件日志）
        if: always()
        shell: pwsh
        run: |
          $out = "ui-evidence/crash-scene"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($root in @("$env:LOCALAPPDATA\TaoPad", "D:\TaoPadData\TaoPad", "$env:LOCALAPPDATA\Microsoft\Windows\WER", "$env:ProgramData\Microsoft\Windows\WER")) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'TaoPad' } |
                Copy-Item -Destination $out -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-2)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'TaoPad' -or $_.ProviderName -match 'TaoPad' } |
            Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message |
            Out-File "$out\application-events.txt" -Encoding utf8 -Width 400
          Write-Host "崩溃现场收集完成：$out"

      - name: 上传界面自动化证据（B 场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-ui-automation-b
          path: |
            ui-evidence/**
            evidence/**
          if-no-files-found: ignore
          retention-days: 14

  # 作业 5：升级与回滚路径（独立 runner）
  upgrade-rollback:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 升级与回滚路径（覆盖安装→静默卸载→重装验证）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $msi = (Resolve-Path out/*.msi).Path
          $p1 = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($p1.ExitCode -ne 0) { throw "覆盖安装失败，退出码 $($p1.ExitCode)" }
          Write-Host "覆盖安装退出码: $($p1.ExitCode)"
          $p2 = Start-Process msiexec.exe -ArgumentList "/x","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "静默卸载失败，退出码 $($p2.ExitCode)" }
          Start-Sleep -Seconds 3
          $gone = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -like "*TaoPad*" }
          if ($gone) { throw "卸载后注册表仍有残留条目" }
          Write-Host "卸载校验：注册表无残留"
          $p3 = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($p3.ExitCode -ne 0) { throw "重装失败，退出码 $($p3.ExitCode)" }
          Start-Sleep -Seconds 5
          Snap "evidence\l8-reinstall.png"
          Write-Host "升级与回滚路径：覆盖安装、静默卸载、重装均通过"

      - name: 上传本班证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-upgrade-rollback
          path: evidence/**
          retention-days: 14

  # 作业 6：长稳浸泡 30 分钟（独立 runner；定时/手动触发才跑）
  soak:
    needs: build
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: TaoPad-installer
          path: out

      - name: 静默安装（供本班浸泡）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $msi = (Resolve-Path out/*.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装失败，退出码 $($p.ExitCode)" }

      - name: 长稳浸泡 30 分钟（自动班：定时/手动触发）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Find-AppExeSoak {
            $regKey = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like "*TaoPad*" } | Select-Object -First 1
            if ($regKey -and $regKey.InstallLocation -and (Test-Path (Join-Path $regKey.InstallLocation "TaoPad.exe"))) {
              return (Join-Path $regKey.InstallLocation "TaoPad.exe")
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoPad\TaoPad.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if (Test-Path $pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoPad.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $appExe = Find-AppExeSoak
          if (-not $appExe) { throw "浸泡前找不到已安装的 TaoPad.exe" }
          Write-Host "浸泡目标: $appExe"
          Start-Process $appExe
          Start-Sleep -Seconds 15
          if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "浸泡启动失败，进程不在" }
          $minutes = 0
          while ($minutes -lt 30) {
            Start-Sleep -Seconds 60
            $minutes++
            if (-not (Get-Process TaoPad -ErrorAction SilentlyContinue)) { throw "浸泡第 $minutes 分钟进程退出，长稳不过" }
            if ($minutes % 10 -eq 0) {
              Snap "evidence\soak-$minutes.png"
              $sz = (Get-Item "evidence\soak-$minutes.png").Length
              if ($sz -lt 20000) { throw "第 $minutes 分钟截图疑似空白（$sz 字节），视觉回归不过" }
              Write-Host "浸泡 ${minutes}/30 分钟存活，截图 ${sz} 字节"
            }
          }
          Get-Process TaoPad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "长稳浸泡 30 分钟通过，三张留证截图非空白"

      - name: 上传本班证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-soak
          path: evidence/**
          retention-days: 14
